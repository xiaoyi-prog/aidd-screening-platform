version: "3.9"

# AIDD 活性分子筛选平台 —— 数据库编排
# 用法：
#   cp .env.example .env && docker compose up -d
#   首次初始化：docker compose exec -T pg bash -lc 'for f in /migrations/*.sql; do psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f "$f" || exit 1; done'

services:
  pg:
    image: postgres:16.9
    container_name: aidd-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置密码}
      POSTGRES_DB: ${POSTGRES_DB:-aidd}
      # 中文注释依赖 UTF8；排序规则用 C 可避免平台差异导致的索引行为不一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./scripts:/scripts:ro
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=3GB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
      - -c
      - timezone=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidd} -d ${POSTGRES_DB:-aidd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
    name: aidd_pgdata
